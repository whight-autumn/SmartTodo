<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f1e8">
  <title>SmartTodo V1.2.2 · by 萤火</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div class="app-shell">
    <header class="app-header brand-bar">
      <div class="brand brand-lockup" aria-label="SmartTodo V1.2.2">
        <img class="brand-icon brand-mark" src="../assets/brand/icon-master.svg" alt="" width="48" height="48">
        <span class="brand-text-wrap brand-copy">
          <span class="brand-main-line">
            <strong class="brand-name">SmartTodo</strong>
            <span id="app-version" class="brand-version">V1.2.2</span>
          </span>
          <small class="brand-owner">by 萤火</small>
        </span>
      </div>

      <div class="header-controls brand-tools">
        <span class="brand-principle">本地优先 · 专注高效</span>
        <label class="brightness-control" title="拖动调节界面亮度，双击恢复 100%">
          <span class="brightness-icon" aria-hidden="true">◐</span>
          <input id="brightness-slider" type="range" min="75" max="125" step="5" value="100"
            aria-label="界面亮度" aria-valuetext="100%">
          <output id="brightness-value" for="brightness-slider">100%</output>
        </label>
        <button id="theme-toggle" class="icon-btn" type="button" title="切换主题" aria-label="切换明暗主题">
          <span data-icon="theme"></span>
        </button>
        <button id="task-widget-toggle" class="icon-btn task-widget-toggle" type="button" title="显示桌面任务笺"
          aria-label="显示桌面任务笺" aria-pressed="false" data-icon="note"></button>
        <button id="global-settings-btn" class="icon-btn" type="button" title="打开设置" aria-label="打开 AI 设置" data-icon="settings"></button>
      </div>
    </header>

    <main class="app-main workspace" id="main-workspace">
      <section class="panel todo-panel task-workbench" aria-labelledby="task-workbench-title">
        <div class="panel-header">
          <h1 id="task-workbench-title"><span data-icon="note"></span>任务待办</h1>
          <span id="task-summary" class="summary-badge" aria-live="polite">0</span>
        </div>

        <form id="task-form" class="task-form task-composer" autocomplete="off">
          <div class="task-composer__primary">
            <label class="sr-only" for="task-title">任务标题</label>
            <input id="task-title" class="input task-composer__title" type="text" placeholder="要做什么？" maxlength="100" required>
            <button class="btn btn-primary submit-btn" type="submit">
              <span data-icon="add"></span><span>添加主任务</span>
            </button>
          </div>
          <div class="task-composer__details">
            <label class="sr-only" for="task-desc">任务备注</label>
            <input id="task-desc" class="input task-composer__note" type="text" placeholder="备注（可选）" maxlength="200">
            <div class="form-row">
              <label class="time-label"><span>提醒</span>
                <input id="task-time" class="input" type="datetime-local" aria-describedby="task-reminder-error" aria-invalid="false">
              </label>
              <label class="priority-label"><span>优先级</span>
                <select id="task-priority" class="input task-select">
                  <option value="low">低</option>
                  <option value="medium" selected>中</option>
                  <option value="high">高</option>
                </select>
              </label>
              <label class="type-label"><span>类型</span>
                <select id="task-type" class="input task-select">
                  <option value="main" selected>主任务</option>
                  <option value="sub">子任务</option>
                </select>
              </label>
              <label class="recurrence-label"><span>重复</span>
                <select id="task-recurrence" class="input task-select">
                  <option value="none" selected>不重复</option>
                  <option value="daily">每天</option>
                  <option value="weekly">每周</option>
                  <option value="monthly">每月</option>
                  <option value="yearly">每年</option>
                </select>
              </label>
            </div>
            <p id="task-reminder-error" class="task-field-error" role="alert" aria-live="polite"></p>
          </div>
          <div id="parent-task-row" class="task-composer__parent hidden">
            <label class="parent-label"><span>选择主任务</span>
              <select id="task-parent" class="input task-select">
                <option value="">— 请选择一个主任务 —</option>
              </select>
            </label>
          </div>
          <p id="task-form-tip" class="task-form-tip task-composer__tip">默认添加主任务；也可通过任务操作添加子任务。</p>
        </form>

        <div class="filter-bar" aria-label="任务筛选">
          <button class="filter-btn attention-filter" type="button" data-filter="attention" aria-pressed="false">
            需关注 <span class="filter-count" data-filter-count="attention">0</span>
          </button>
          <button class="filter-btn active" type="button" data-filter="active" aria-pressed="true">
            进行中 <span class="filter-count" data-filter-count="active">0</span>
          </button>
          <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">
            已完成 <span class="filter-count" data-filter-count="completed">0</span>
          </button>
        </div>

        <ul id="task-list" class="task-list"></ul>
        <button id="task-load-more" class="btn task-load-more" type="button" hidden>显示更多任务</button>
        <div id="empty-tip" class="empty-tip empty-state">
          <span class="empty-icon empty-state__mark" data-icon="check"></span>
          <h2>从一件要紧的事开始</h2>
          <p>写下任务，再按需补充提醒、优先级或子任务。</p>
        </div>
      </section>

      <section class="panel ai-panel ai-sidecar" aria-labelledby="ai-sidecar-title">
        <header class="panel-header ai-sidecar-header ai-sidecar__head">
          <div class="ai-sidecar__title">
            <h2 id="ai-sidecar-title"><span data-icon="analyze"></span>知行助手</h2>
          </div>
          <div class="ai-actions">
            <button id="ai-new-session-btn" class="icon-btn" type="button" title="新建会话" aria-label="新建会话"><span data-icon="new-session"></span><span class="ai-action-label">新对话</span></button>
            <button id="ai-clear-btn" class="icon-btn" type="button" title="清理历史会话" aria-label="清理历史会话"><span data-icon="clear"></span><span class="ai-action-label">清空历史</span></button>
            <button id="ai-settings-btn" class="icon-btn" type="button" title="API 设置" aria-label="打开 AI 设置"><span data-icon="settings"></span><span class="ai-action-label">设置</span></button>
            <button id="ai-collapse-btn" class="icon-btn" type="button" title="收起助手" aria-label="收起助手" aria-expanded="true" data-icon="collapse"></button>
          </div>
        </header>

        <div id="chat-box" class="chat-box" aria-live="polite"></div>
        <div id="chat-attachments" class="chat-attachments hidden"></div>

        <div class="chat-footer chat-composer">
          <label class="sr-only" for="user-input">向知行助手提问</label>
          <textarea id="user-input" class="chat-input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
          <label class="icon-btn upload-btn" title="上传文件" aria-label="上传文件">
            <input id="file-input" type="file" multiple>
            <span data-icon="upload"></span>
          </label>
          <button id="send-tasks-btn" class="icon-btn analyze-btn" type="button" title="让 AI 分析我的任务" aria-label="分析当前任务">
            <span data-icon="analyze"></span><span class="action-label">分析当前任务</span>
          </button>
          <button id="send-btn" class="btn btn-primary send-btn" type="button" disabled>
            <span data-icon="send"></span><span>发送</span>
          </button>
        </div>
      </section>
    </main>
  </div>

  <dialog id="task-note-dialog" class="settings-dialog task-note-dialog" aria-labelledby="task-note-heading">
    <div class="modal-card dialog-sheet">
      <header class="modal-head dialog-sheet__head">
        <h3 id="task-note-heading">编辑任务备注</h3>
      </header>
      <div class="modal-body dialog-sheet__body">
        <label class="field-label" for="task-note-input">任务备注</label>
        <textarea id="task-note-input" class="input task-note-input" rows="6" placeholder="记录补充信息，也可以粘贴 HTTP/HTTPS 链接"></textarea>
        <div class="task-note-attachment-tools">
          <label class="field-label" for="task-note-file-input">任务附件</label>
          <input id="task-note-file-input" type="file" multiple hidden>
          <button id="task-note-file-button" class="btn btn-secondary task-note-upload" type="button" aria-describedby="task-note-limit">
            <span data-icon="add"></span><span>添加附件</span>
          </button>
          <span id="task-note-limit" class="hint">最多 10 个，每个不超过 20MB</span>
        </div>
        <ul id="task-note-attachment-list" class="task-note-attachment-list" aria-label="任务附件"></ul>
        <p id="task-note-status" class="hint task-note-status" role="status" aria-live="polite"></p>
      </div>
      <footer class="modal-foot dialog-sheet__foot task-note-actions">
        <button id="task-note-cancel" class="btn btn-secondary" type="button">取消</button>
        <button id="task-note-save" class="btn btn-primary" type="button">保存</button>
      </footer>
    </div>
  </dialog>

  <dialog id="settings-modal" class="settings-dialog" aria-labelledby="settings-heading">
    <div class="modal-card dialog-sheet">
      <header class="modal-head dialog-sheet__head">
        <h3 id="settings-heading">知行助手设置</h3>
        <button class="icon-btn" type="button" data-close-modal aria-label="关闭设置" data-icon="close"></button>
      </header>
      <div class="modal-body dialog-sheet__body">
        <label class="field-label" for="provider-select">AI 服务商</label>
        <select id="provider-select" class="input">
          <option value="deepseek">DeepSeek</option>
          <option value="openai">OpenAI</option>
          <option value="custom">自定义 OpenAI 兼容服务</option>
        </select>
        <label class="field-label" for="base-url-input">API 地址</label>
        <input id="base-url-input" class="input" type="url" placeholder="https://api.example.com/v1">
        <label class="field-label" for="model-input">模型名称</label>
        <input id="model-input" class="input" type="text" placeholder="例如：deepseek-chat">
        <label class="field-label" for="api-key-input">API Key</label>
        <input id="api-key-input" class="input" type="password" placeholder="sk-..." autocomplete="off">
        <p class="hint">配置仅保存在本地运行数据中。请确认 API 地址对应 OpenAI-compatible 的 /chat/completions 接口。</p>
        <p id="data-path-hint" class="hint data-path-hint"></p>
        <p class="hint">还没有 Key？<a href="https://platform.deepseek.com" target="_blank" rel="noopener">前往 DeepSeek 开放平台申请</a></p>
      </div>
      <footer class="modal-foot dialog-sheet__foot">
        <button id="save-key-btn" class="btn btn-primary" type="button">保存设置</button>
      </footer>
    </div>
  </dialog>

  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form method="dialog" class="dialog-sheet">
      <header class="dialog-sheet__head">
        <h3 id="confirm-title">删除任务</h3>
      </header>
      <div class="dialog-sheet__body">
        <p id="confirm-message"></p>
      </div>
      <footer class="confirm-actions dialog-sheet__foot">
        <button class="btn btn-secondary" value="cancel" autofocus>取消</button>
        <button id="confirm-accept" class="btn btn-danger" value="confirm">确认删除</button>
      </footer>
    </form>
  </dialog>

  <script src="recurrence-model.js"></script>
  <script src="task-model.js"></script>
  <script src="widget-model.js"></script>
  <script src="draft-store.js"></script>
  <script src="ai-provider.js"></script>
  <script src="ui-appearance.js"></script>
  <script src="note-utils.js"></script>
  <script src="icon-utils.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="motion.js"></script>
  <script src="app.js"></script>
</body>
</html>
