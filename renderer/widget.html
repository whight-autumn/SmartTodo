<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111815">
  <title>SmartTodo 桌面任务笺</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <section id="widget-shell" class="widget-shell" aria-label="SmartTodo 桌面任务笺">
    <header id="widget-drag-region" class="widget-drag-region">
      <div class="widget-brand">
        <img class="widget-brand__mark" src="../assets/brand/icon-master.svg" width="30" height="30" alt="">
        <span class="widget-brand__copy">
          <strong>SmartTodo</strong>
        </span>
        <span class="widget-version">V1.2.2</span>
      </div>
      <div class="widget-tools" aria-label="窗口操作">
        <button id="widget-header-hide" class="widget-tool" type="button" title="收起任务笺" aria-label="收起任务笺" data-icon="close"></button>
      </div>
    </header>

    <div class="widget-section-head">
      <h1 id="widget-heading">今日要务</h1>
      <div class="widget-overview">
        <time id="widget-date"></time>
        <span id="widget-count">0 项</span>
      </div>
    </div>

    <main class="widget-content">
      <ul id="widget-list" class="widget-list" aria-label="待处理任务"></ul>
      <p id="widget-empty" class="widget-empty" hidden>此刻案头清简</p>
    </main>

    <footer class="widget-footer">
      <p id="widget-status" class="widget-status" role="status" aria-live="polite"></p>
      <button id="widget-open-main" class="widget-action widget-action--primary" type="button">
        <span data-icon="note"></span><span>打开 SmartTodo</span>
      </button>
    </footer>
  </section>

  <script src="widget-model.js"></script>
  <script src="icon-utils.js"></script>
  <script src="widget.js"></script>
</body>
</html>
